<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini CRM</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Client Lead Management System</h1>
        <p class="subtitle">Mini CRM Dashboard</p>

        <!-- Add Lead Form -->
        <div class="card">

            <h2>Add New Lead</h2>

            <form id="leadForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Lead Name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="text"
                    id="source"
                    placeholder="Source (Website, LinkedIn, etc.)"
                    required
                >

                <select id="status">
                    <option value="New">New</option>
                    <option value="Contacted">Contacted</option>
                    <option value="Converted">Converted</option>
                </select>
                <textarea
                id="notes"
                placeholder="Notes">
            </textarea>
            <input 
            type="date"
            id="followUp">

                <button type="submit">Add Lead</button>

            </form>

        </div>

        <!-- Leads Table -->
        <div class="card">

            <h2>Leads</h2>

            <table>

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Source</th>
                        <th>Status</th>
                        <th>Notes</th>
                        <th>Follow-up</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="leadTableBody">
                    <!-- Leads will appear here -->
                </tbody>

            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
